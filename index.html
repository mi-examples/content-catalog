<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Catalog</title>
    <!-- Truist theme typography: Archivo headings, Inter body, IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Portal Page Variables. pp-dev replaces each [Variable Name] with the value
      configured on the Portal Page (see MI_APP_ID in .env / pp-dev.config.ts).
      Any placeholder that is left unsubstituted is treated as "unset" at runtime
      by ppVar() in src/constants.ts.
    -->
    <script>
      window.PP_VARIABLES = {
        CONTENT_SOURCE: '[Content Source]',
        WELCOME_MESSAGE: '[Welcome Message]',
        HERO_SUBTEXT: '[Hero Subtext]',
        HERO_IMAGE: '[Hero Image]',
        LOGO: '[Logo]',
        SIDEBAR_LOGO: '[Sidebar Logo]',
        HIDE_EMPTY_NODES: '[Hide Empty Nodes]',
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
